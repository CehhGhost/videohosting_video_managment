<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#44506a"/>
    </marker>
    <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b5761a"/>
    </marker>
  </defs>

  <rect width="900" height="430" fill="#ffffff"/>

  <!-- arrows -->
  <g stroke="#44506a" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M190 186 H349"/>
    <path d="M350 216 H191"/>
    <path d="M445 160 V68 H709"/>
    <path d="M540 200 H709"/>
    <path d="M445 240 V332 H709"/>
  </g>
  <path d="M110 230 V398 H790 V361" stroke="#b5761a" stroke-width="1.6" fill="none" marker-end="url(#arrw)"/>

  <!-- arrow labels -->
  <g fill="#1c2433" font-size="12" text-anchor="middle">
    <text x="270" y="178">1. запрос на загрузку</text>
    <text x="270" y="234">5. presigned PUT URL</text>
    <text x="577" y="60">2. создать метаданные</text>
    <text x="625" y="192">3. запись объекта</text>
    <text x="577" y="324">4. сформировать presigned PUT URL</text>
  </g>
  <g fill="#5b6781" font-size="11" text-anchor="middle">
    <text x="577" y="84">в ответ — videoId</text>
    <text x="625" y="216">статус PENDING_UPLOAD</text>
  </g>
  <text x="450" y="390" fill="#8a5a12" font-size="12" text-anchor="middle">6. прямая загрузка файла в Garage по presigned URL, минуя сервис</text>

  <!-- nodes -->
  <rect x="30" y="170" width="160" height="60" rx="30" fill="#f4f6fa" stroke="#5b6b8a" stroke-width="1.4"/>
  <rect x="350" y="160" width="190" height="80" rx="6" fill="#e3ecff" stroke="#2f5bd0" stroke-width="2"/>
  <g fill="#f4f6fa" stroke="#5b6b8a" stroke-width="1.4">
    <rect x="710" y="40" width="160" height="56" rx="6"/>
    <rect x="710" y="172" width="160" height="56" rx="6"/>
    <rect x="710" y="304" width="160" height="56" rx="6"/>
  </g>

  <g fill="#1c2433" text-anchor="middle">
    <text x="110" y="198">Пользователь</text>
    <text x="445" y="196" font-weight="600">video_managment</text>
    <text x="790" y="73">video_metadata</text>
    <text x="790" y="205">PostgreSQL</text>
    <text x="790" y="337">Garage</text>
  </g>
  <g fill="#5b6781" font-size="11.5" text-anchor="middle">
    <text x="110" y="215">с JWT</text>
    <text x="445" y="216">проверка JWT → ownerId</text>
  </g>
</svg>
