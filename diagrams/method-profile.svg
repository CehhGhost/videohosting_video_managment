    <rect x="70" y="92" width="420" height="46" rx="6"/>
    <rect x="70" y="158" width="420" height="46" rx="6"/>
    <rect x="70" y="224" width="420" height="46" rx="6"/>
    <rect x="70" y="290" width="420" height="46" rx="6"/>
