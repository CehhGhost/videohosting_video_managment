<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#44506a"/>
    </marker>
  </defs>

  <rect width="660" height="500" fill="#ffffff"/>

  <text x="575" y="16" fill="#5b6781" font-size="11.5" text-anchor="middle">практика SSDF</text>

  <!-- connectors -->
  <g stroke="#44506a" stroke-width="1.6" fill="none" marker-end="url(#arr)">
