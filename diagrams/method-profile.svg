    <text x="280" y="462" font-weight="600">для решения о выпуске</text>
  </g>

  <!-- SSDF tags -->
  <g fill="#fff4e0" stroke="#c98a1b" stroke-width="1.2">
    <rect x="520" y="36" width="110" height="26" rx="13"/>
    <rect x="520" y="168" width="110" height="26" rx="13"/>
